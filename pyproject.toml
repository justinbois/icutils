[project]
authors = [{name = "Justin Bois", email = "bois@caltech.edu"}]
name = "icutils"
requires-python = ">= 3.11"
version = "0.2.0"
dependencies = ["iqplot>=0.3.7,<0.4"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.setuptools.package-data]
icutils = ["data/*"]

[project.scripts]
icutils = "icutils.cli:cli"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
icutils = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
polars = ">=1.34.0,<2"
pandas = ">=2.3.3,<3"
numpy = ">=2.4.1,<3"
bokeh = ">=3.8.1,<4"
jupyter_bokeh = ">=4.0.5,<5"
matplotlib = ">=3.10.8,<4"
seaborn = ">=0.13.2,<0.14"
scipy = ">=1.17.0,<2"
click = ">=8.3.1,<9"
colorcet = ">=3.1.0,<4"
mypy = ">=1.19.1,<2"
scikit-learn = ">=1.8.0,<2"
scikit-image = ">=0.26.0,<0.27"
sympy = ">=1.14.0,<2"
statsmodels = ">=0.14.6,<0.15"
xlrd = ">=2.0.2,<3"
nodejs = ">=25.2.1,<25.3"
fastexcel = ">=0.18.0,<0.19"
pyarrow = ">=22.0.0,<23"
openpyxl = ">=3.1.5,<4"
ipython = ">=9.9.0,<10"
jupyter = ">=1.1.1,<2"
black = ">=25.12.0,<26"
blackcellmagic = ">=0.0.2,<0.0.3"
jupyterlab = ">=4.5.2,<5"
jupyterlab-spellchecker = ">=0.8.4,<0.9"
watermark = ">=2.5.0,<3"
great_tables = ">=0.20.0,<0.21"
